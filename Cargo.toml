[package]
name = "mull"
version = "0.8.0"
authors = ["Stephan Boyer <stephan@stephanboyer.com>"]
edition = "2024"
description = "Organize your knowledge."
license = "MIT"
documentation = "https://github.com/stepchowfun/mull"
homepage = "https://github.com/stepchowfun/mull"
repository = "https://github.com/stepchowfun/mull"
readme = "README.md"

[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.default_numeric_fallback = "deny"
clippy.pedantic = { level = "deny", priority = -1 }
rust.warnings = "deny"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
ignore = "0.4.33"
similar = "3.2.0"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
tower-lsp-server = "0.23.0"
